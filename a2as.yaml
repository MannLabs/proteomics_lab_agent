tools:
  analyze_proteomics_video:
    type: function
    agents: [video_analyzer_agent]
    params:
      description: |-
        Analyze a proteomics laboratory video.

        Args:
            query: Query containing video path and analysis request

        Returns:
            Dictionary with 'status' and either 'analysis' or 'error_message'
  generate_lab_notes:
    type: function
    agents: [lab_note_generator_agent]
    params:
      description: |-
        Generates lab notes by comparing videos with their baseline protocol procedures.

        Parameters
        ----------
        query : str
            Query containing video path and analysis request.
        tool_context : ToolContext | None
            ToolContext containing shared state from the lab_knowledge agent .
        protocol_input : str, optional
            Protocol provided as a string as alternative to provided by ToolContext.

        Returns
        -------
        dict
            A dictionary containing a 'status' and either an 'analysis' or 'error_message'.
  generate_protocols:
    type: function
    agents: [protocol_generator_agent]
    params:
      description: |-
        Generates protocols from input text or videos.

        Parameters
        ----------
        query : str
            Query containing text input or video path and special user request.

        Returns
        -------
        dict
            A dictionary containing a 'status' and either an 'analysis' or 'error_message'.
